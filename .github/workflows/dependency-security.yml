name: Dependency Security Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "prisma/**"
      - "src/**"
      - "app/**"
      - ".github/workflows/dependency-security.yml"
      - ".github/workflows/dependency-lock-refresh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://audit:build-only-placeholder@127.0.0.1:5432/audit
      NEXTAUTH_SECRET: build-only-placeholder-secret-not-for-production
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build production application
        run: npm run build
      - name: Summarize production audit findings
        if: always()
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const a=require(process.env.RUNNER_TEMP+"/npm-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities||{})) { const via=(v.via||[]).map(x=>typeof x==="string"?x:(x.title||x.name||"advisory")).join("; "); console.log(name+" | severity="+v.severity+" | direct="+v.isDirect+" | range="+v.range+" | fix="+JSON.stringify(v.fixAvailable)+" | via="+via); }'
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
